[package]
name = "website"
version = "0.1.0"
edition = "2021"

[dependencies]
yav = { path = "../yav.rs/crates/yav" }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# Optimize MSVC link time on Windows (line-tables-only, 10x faster linking)
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
